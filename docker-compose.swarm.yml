version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wawi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wawi_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-wawi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wawi-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - wawi-overlay
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  wawi-middleware:
    image: puchadave/wawi-middleware:latest
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-wawi}:${POSTGRES_PASSWORD:-wawi_secure_password_2026}@postgres:5432/${POSTGRES_DB:-wawi_db}
      REDIS_URL: redis://redis:6379
      SHOPWARE_API_URL: ${SHOPWARE_API_URL:-}
      SHOPWARE_CLIENT_ID: ${SHOPWARE_CLIENT_ID:-}
      SHOPWARE_CLIENT_SECRET: ${SHOPWARE_CLIENT_SECRET:-}
      WAWI_ADMIN_USERNAME: ${WAWI_ADMIN_USERNAME:-}
      WAWI_ADMIN_EMAIL: ${WAWI_ADMIN_EMAIL:-}
      WAWI_ADMIN_PASSWORD: ${WAWI_ADMIN_PASSWORD:-}
      WAWI_ADMIN_PASSWORD_HASH: ${WAWI_ADMIN_PASSWORD_HASH:-}
    volumes:
      - wawi_data:/app/data
      - wawi_logs:/app/data/logs
    ports:
      - target: 8080
        published: 8080
        mode: ingress
    networks:
      - wawi-overlay
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: any
        delay: 5s

volumes:
  postgres_data:
  redis_data:
  wawi_data:
  wawi_logs:

networks:
  wawi-overlay:
    driver: overlay
    attachable: true
