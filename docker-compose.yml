version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wawi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wawi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wawi_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-wawi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wawi} -d ${POSTGRES_DB:-wawi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wawi-network

  redis:
    image: redis:7-alpine
    container_name: wawi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wawi-network

  wawi-middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wawi-middleware
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-wawi}:${POSTGRES_PASSWORD:-wawi_secure_password_2026}@postgres:5432/${POSTGRES_DB:-wawi_db}
      REDIS_URL: redis://redis:6379
      SHOPWARE_API_URL: ${SHOPWARE_API_URL:-}
      SHOPWARE_CLIENT_ID: ${SHOPWARE_CLIENT_ID:-}
      SHOPWARE_CLIENT_SECRET: ${SHOPWARE_CLIENT_SECRET:-}
    volumes:
      - wawi_data:/app/data
      - wawi_logs:/app/data/logs
    ports:
      - "${WAWI_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - wawi-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  wawi_data:
    driver: local
  wawi_logs:
    driver: local

networks:
  wawi-network:
    driver: bridge
